<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 class="text-shadow-lg text-shadow-gray-400 p-4 m-4 rounded-xl text-2xl bg-green-100 text-green-600">
        Tailwindcss
    </h1>

    <div class="flex gap-3 shadow w-fit rounded p-3 m-4">
        <div>
            <label for="" class="block">Name</label>
            <input type="text"
            class="focus:outline-none focus:border-sky-600 bg-gray-100 py-1 px-2 rounded border border-gray-400" 
            placeholder="Provide valid name">
        </div>
        
        <div>
            <label for="" class="block">Email</label>
            <input type="text"
            class="focus:outline-none focus:border-sky-600 bg-gray-100 py-1 px-2 rounded border border-gray-400" 
            placeholder="Provide valid email">
        </div>
    </div>

    <button class="cursor-pointer hover:shadow-lg hover:bg-red-400 bg-red-300 m-4 px-2 rounded">
        Button
    </button>



    <!-- js -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>
</html>
