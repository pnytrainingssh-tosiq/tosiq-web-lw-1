<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .grid > div {
            background-color: orange;
            padding: 12px;
        }
    </style>
</head>
<body>
    <h3 class="bg-sky-200 p-3 m-3 rounded shadow">
        Grid in tailwindcss
    </h3>

    <div class="p-3 m-3">
        <div class="grid grid-cols-12 gap-3">
            <div class="col-span-6 lg:col-span-8"> col 6 </div>
            <div class="col-span-6 lg:col-span-4"> col 6 </div>

            <div class="col-span-12 lg:col-span-4"> col 4 </div>
            <div class="col-span-12 lg:col-span-4"> col 4 </div>
            <div class="col-span-12 lg:col-span-4"> col 4 </div>
        </div>

    </div>


    
</body>
</html>
