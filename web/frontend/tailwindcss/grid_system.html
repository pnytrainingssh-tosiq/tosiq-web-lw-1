<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid > div {
            background-color: teal;
            border: 2px solid rgb(3, 45, 45);
            padding: 16px;
        }
    </style>
</head>
<body>
    <h1>
        Grid in tailwindcss
    </h1>

    <div class="m-3 grid grid-cols-12 gap-3">

        <div class="col-span-12 md:col-span-6 lg:col-span-6"></div>
        <div class="col-span-12 md:col-span-6 lg:col-span-6"></div>

        <div class="col-span-12 md:col-span-6 lg:col-span-4"></div>
        <div class="col-span-12 md:col-span-6 lg:col-span-4"></div>
        <div class="col-span-12 md:col-span-6 lg:col-span-4"></div>

        <div class="col-span-12 md:col-span-6 lg:col-span-3"></div>
        <div class="col-span-12 md:col-span-6 lg:col-span-9"></div>

        <div class="col-span-12 md:col-span-6 lg:col-span-7"></div>
        <div class="col-span-12 md:col-span-6 lg:col-span-5"></div>
    </div>
    <!-- js -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>
</html>
