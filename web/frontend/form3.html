<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Student Form 3</h2>

    <form>
        <div>
            <label>Name</label>
            <input type="text" placeholder="John doe">
        </div>

        <div>
            <label>Email</label>
            <input type="email" placeholder="john.doe@gmail.com">
        </div>

        <div>
            <label>Password</label>
            <input type="password" placeholder="*****">
        </div>

        <div>
            <label>DOB</label>
            <input type="date">
        </div>

        <div>
            <label>Photo</label>
            <input type="file" accept=".png, .jpg, .jpeg, .pdf">
        </div>

        <div>
            <label>Color</label>
            <input type="color">
        </div>

        <div>
            <label>Gender</label> <br />

            <input type="radio" name="g">
            <label for="">Male</label>

            <input type="radio" name="g">
            <label for="">Female</label>
        </div>

        <div>
            <label>Course selection</label> <br>

            <input type="checkbox" id="web">
            <label for="web">Web development</label>

            <input type="checkbox" id="gd">
            <label for="gd">Graphic designing</label>

            <input type="checkbox" id="aiml">
            <label for="aiml">AI/ML</label>
        </div>

        <div>
            <label>Languages</label> <br>

            <select>
                <option>--- CHOOSE ONE OPTION ---</option>
                <option>Arabic</option>
                <option>UK</option>
                <option>US</option>
                <option>Urdu</option>
            </select>

        </div>

        <div>
            <label>Message</label> <br>
            <textarea rows="4" cols="30" placeholder="Enter message from student"></textarea>
        </div>
        
        <div>
            <input type="submit" value="Register student">
        </div>
    </form>

</body>
</html>
