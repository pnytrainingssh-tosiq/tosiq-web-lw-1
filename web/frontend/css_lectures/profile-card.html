<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./profile-card.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.css" integrity="sha512-GmZYQ9SKTnOea030Tbiat0Y+jhnYLIpsGAe6QTnToi8hI2nNbVMETHeK4wm4MuYMQdrc38x+sX77+kVD01eNsQ==" crossorigin="anonymous" referrerpolicy="no-referrer">

</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="user-profile">
                <img src="./assets/profile-img.avif" class="profile-img">
                <span class="username">Samantha kent</span>
            </div>
            <div>
                <button class="follow-btn">
                    <i class="fa-solid fa-user-plus"></i>
                </button>
            </div>
        </div>

        <div class="card-body">
            <p>
                Lorem ipsum dolor sit, amet consectetur adipisicing elit. Pariatur ab, 
                repudiandae consectetur 
            </p>
            <div class="stats">
                <div>
                    <span class="numbering">10K</span>
                    <span class="title">Posts</span>
                </div>
                <div class="divider"></div>
                <div>
                    <span class="numbering">24K</span>
                    <span class="title">Likes</span>
                </div>
                <div class="divider"></div>
                <div>
                    <span class="numbering">1.2K</span>
                    <span class="title">Copies</span>
                </div>
                <div class="divider"></div>
                <div>
                    <span class="numbering">12K</span>
                    <span class="title">Followers</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
