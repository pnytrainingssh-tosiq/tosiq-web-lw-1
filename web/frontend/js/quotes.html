<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">
    
    <div class="my-5 rounded-lg shadow max-w-4xl bg-white p-5 mx-auto ">
        <h2 class="text-[24px] font-bold mb-5">
            All quotes
        </h2>
        <div class="mb-3">
            <label for="">Author:</label>
            <select id="author" onchange="filterByAuthor()" class="p-3 border border-gray-300 bg-gray-200 rounded w-[150px]">
                <option value="all">ALL</option>
                <option value="Alexander">Alexander</option>
                <option value="Sam">Sam</option>
                <option value="John">John</option>
                <option value="Harry">Harry</option>
            </select>
        </div>
        <table width="100%" class="rounded shadow bg-white">
            <thead>
                <tr align="left" class="border-b border-gray-200">
                    <th class="px-3 py-4">ID</th>
                    <th class="px-3 py-4">Author</th>
                    <th class="px-3 py-4">Quote</th>
                </tr>
            </thead>
            <tbody id="quote-tbl">
                
            </tbody>
        </table>
    </div>

    <!-- js -->
    <script src="./quotes.js"></script>
</body>
</html>
